# Pokémon Alola Adventure: the mod list.
#
# This file is the source of truth. `python tools/modpack.py resolve` turns it
# into modpack.lock.json (exact versions, hashes and download URLs from
# Modrinth), pulling in required libraries automatically. CI does this on every
# push, then builds the .mrpack and boots a server with it.
#
# Entry fields:
#   id          Modrinth slug or project id
#   note        why it is in the pack (shown in MODS.md)
#   kind        "mod" (default), "resourcepack" or "shader"
#   pin         a version number to lock to (pinned mods are resolved first)
#   match       regex a version number or file name must contain, for addons
#               that publish separate builds per Cobblemon version
#   anchor      true = every other mod must accept this mod's version
#   side        "client", "server" or "both" to override Modrinth's metadata
#   optional    true = the launcher may let players skip it

[pack]
name = "Pokemon Alola Adventure"
version = "1.0.0"
summary = "Cobblemon on Fabric 1.21.1, rebuilt around Pokémon Sun & Moon: Alolan starters, Z-Moves, the Island Challenge, tropical islands and volcanoes, Poké Pelago, Poké Ride and a whole lot of island life."
minecraft = "1.21.1"
game_versions = ["1.21.1", "1.21"]
fabric_loader = "latest"

# ---------------------------------------------------------------------------
