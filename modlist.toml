title = "Cobblemon core"
mods = [
  { id = "cobblemon", pin = "1.7.3", anchor = true, note = "The Pokémon mod. Pinned to 1.7.3, the release the addon ecosystem supports (1.7 brought Poké Ride-style riding)" },
