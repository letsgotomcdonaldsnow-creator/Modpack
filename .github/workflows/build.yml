name: Build modpack

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upgrade:
        description: Re-resolve every mod to its newest compatible version
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: downloads-${{ hashFiles('modpack.lock.json', 'modlist.toml') }}
          restore-keys: downloads-

      - name: Resolve mods from Modrinth
        run: python tools/modpack.py resolve --keep-going ${{ inputs.upgrade && '--upgrade' || '' }}

      - name: Commit lockfile and mod list
        if: github.ref_type == 'branch'
        run: |
          if [ -n "$(git status --porcelain -- modpack.lock.json MODS.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add modpack.lock.json MODS.md
            git commit -m "Update lockfile and MODS.md"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Validate mod dependencies (client and server)
        id: validate
        continue-on-error: true
        run: python tools/modpack.py validate

      - name: Build .mrpack
        run: python tools/modpack.py build

      - name: Upload .mrpack
        uses: actions/upload-artifact@v4
        with:
          name: modpack
          path: dist/*.mrpack

      - name: Upload lockfile for the client test
        uses: actions/upload-artifact@v4
        with:
          name: lockfile
          path: modpack.lock.json

      - name: Assemble server
        run: python tools/modpack.py server --dir build/server --accept-eula

      - name: Boot server
        id: boot
        continue-on-error: true
        run: >
          python tools/modpack.py boot --dir build/server --memory 5G
          --command "function alola:selftest"

      - name: Build the block catalog (vanilla report + every mod's blockstates)
        if: github.ref_type == 'branch'
        continue-on-error: true
        run: |
          ls build/server
          jar=$(ls build/server/server.jar build/server/*.jar 2>/dev/null | grep -v fabric-server-launch | head -1)
          echo "vanilla jar: $jar"
          (cd build && java -DbundlerMainClass=net.minecraft.data.Main -jar "../$jar" --reports --output reports 2>&1 | tail -5) || true
          report=$(find build/reports -name blocks.json | head -1)
          echo "report: $report"
          python tools/modpack.py catalog ${report:+--vanilla-report "$report"}
          if [ -n "$(git status --porcelain -- tools/worldgen/block_catalog.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add tools/worldgen/block_catalog.json
            git commit -m "Update block catalog"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: |
            build/server-boot.log
            build/server/logs/latest.log
            build/server/crash-reports/
          if-no-files-found: ignore

      - name: Fail on problems
        run: |
          status=0
          if [ -s build/resolve-errors.txt ]; then echo "::error::Some mods could not be resolved"; cat build/resolve-errors.txt; status=1; fi
          if [ "${{ steps.validate.outcome }}" != "success" ]; then echo "::error::Dependency validation failed"; status=1; fi
          if [ "${{ steps.boot.outcome }}" != "success" ]; then echo "::error::Server boot test failed"; status=1; fi
          exit $status

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.mrpack
          generate_release_notes: true

  client:
    name: Boot client
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Get the lockfile the build job resolved
        uses: actions/download-artifact@v4
        with:
          name: lockfile
          path: .

      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: downloads-${{ hashFiles('modpack.lock.json', 'modlist.toml') }}
          restore-keys: downloads-

      - name: Assemble client
        # Distant Horizons is left out: it only renders far-away terrain and is slow under software OpenGL.
        run: |
          python tools/modpack.py client --dir run --skip '^distanthorizons$'
          printf 'renderDistance:4\nsimulationDistance:5\ngraphicsMode:0\nmaxFps:30\ntutorialStep:none\n' > run/options.txt

      - name: Launch the client, join a world, quit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y x11-xserver-utils >/dev/null
          tools/client_test.sh

      - name: Upload client log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-log
          path: |
            run/logs/latest.log
            run/crash-reports/
          if-no-files-found: ignore

      - name: Show client problems
        if: failure()
        run: |
          ls run/crash-reports 2>/dev/null && head -150 run/crash-reports/*.txt || true
          echo "----- errors -----"
          grep -nE "/ERROR\]|/FATAL\]|Exception|Caused by|Mixin apply .* failed" run/logs/latest.log | cut -c1-400 | head -150 || true
          echo "----- last 200 lines -----"
          tail -200 run/logs/latest.log | cut -c1-400 || true

  publish:
    name: Publish .mrpack to the branch
    needs: [build, client]
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: modpack
          path: dist

      - name: Commit the tested .mrpack
        run: |
          cp dist/*.mrpack Pokemon-Alola-Adventure.mrpack
          if [ -n "$(git status --porcelain -- Pokemon-Alola-Adventure.mrpack)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add Pokemon-Alola-Adventure.mrpack
            git commit -m "Publish tested Pokemon-Alola-Adventure.mrpack"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
