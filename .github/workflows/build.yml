name: Build modpack

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upgrade:
        description: Re-resolve every mod to its newest compatible version
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: downloads-${{ hashFiles('modpack.lock.json', 'modlist.toml') }}
          restore-keys: downloads-

      - name: Resolve mods from Modrinth
        run: python tools/modpack.py resolve --keep-going ${{ inputs.upgrade && '--upgrade' || '' }}

      - name: Commit lockfile and mod list
        if: github.ref_type == 'branch'
        run: |
          if [ -n "$(git status --porcelain -- modpack.lock.json MODS.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add modpack.lock.json MODS.md
            git commit -m "Update lockfile and MODS.md"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Validate mod dependencies (client and server)
        id: validate
        continue-on-error: true
        run: python tools/modpack.py validate

      - name: Generate the Alola Region world
        run: |
          pip install --quiet numpy
          python -m tools.worldgen.generate --save --check --preview build/alola-map.png

      - name: Build .mrpack
        run: python tools/modpack.py build

      - name: Upload .mrpack and map
        uses: actions/upload-artifact@v4
        with:
          name: modpack
          path: |
            dist/*.mrpack
            build/alola-map.png

      - name: Upload lockfile for the client test
        uses: actions/upload-artifact@v4
        with:
          name: lockfile
          path: modpack.lock.json

      - name: Assemble server
        run: python tools/modpack.py server --dir build/server --accept-eula

      - name: Boot server
        id: boot
        continue-on-error: true
        run: >
          python tools/modpack.py boot --dir build/server --memory 5G --settle 20
          --command "function alola:selftest"
          --command "scoreboard players get #done alola_setup"
          --command "scoreboard players get #npcs alola_setup"
          --expect "#done has 1 \[alola_setup\]" "Alola setup function finished"
          --expect "#npcs has [1-9][0-9]+ \[alola_setup\]" "trainers spawned in the Alola world"

      - name: Build the block catalog (vanilla report + every mod's blockstates)
        if: github.ref_type == 'branch'
        continue-on-error: true
        run: |
          python tools/modpack.py catalog --fetch-vanilla
          if [ -n "$(git status --porcelain -- tools/worldgen/block_catalog.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add tools/worldgen/block_catalog.json
            git commit -m "Update block catalog"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: |
            build/server-boot.log
            build/server/logs/latest.log
            build/server/crash-reports/
          if-no-files-found: ignore

      - name: Fail on problems
        run: |
          status=0
          if [ -s build/resolve-errors.txt ]; then echo "::error::Some mods could not be resolved"; cat build/resolve-errors.txt; status=1; fi
          if [ "${{ steps.validate.outcome }}" != "success" ]; then echo "::error::Dependency validation failed"; status=1; fi
          if [ "${{ steps.boot.outcome }}" != "success" ]; then echo "::error::Server boot test failed"; status=1; fi
          exit $status

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.mrpack
          generate_release_notes: true

  client:
    name: Boot client
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Get the lockfile the build job resolved
        uses: actions/download-artifact@v4
        with:
          name: lockfile
          path: .

      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: downloads-${{ hashFiles('modpack.lock.json', 'modlist.toml') }}
          restore-keys: downloads-

      - name: Assemble client
        # Distant Horizons is left out: it only renders far-away terrain and is slow under software OpenGL.
        run: |
          python tools/modpack.py client --dir run --skip '^distanthorizons$'
          printf 'renderDistance:4\nsimulationDistance:5\ngraphicsMode:0\nmaxFps:30\ntutorialStep:none\n' > run/options.txt

      - name: Launch the client, join a world, quit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y x11-xserver-utils >/dev/null
          tools/client_test.sh

      - name: Upload client log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-log
          path: |
            run/logs/latest.log
            run/crash-reports/
          if-no-files-found: ignore

      - name: Show client problems
        if: failure()
        run: |
          ls run/crash-reports 2>/dev/null && head -150 run/crash-reports/*.txt || true
          echo "----- errors -----"
          grep -nE "/ERROR\]|/FATAL\]|Exception|Caused by|Mixin apply .* failed" run/logs/latest.log | cut -c1-400 | head -150 || true
          echo "----- last 200 lines -----"
          tail -200 run/logs/latest.log | cut -c1-400 || true

  tour:
    name: In-game screenshots
    needs: build
    if: ${{ !cancelled() && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Get the lockfile the build job resolved
        uses: actions/download-artifact@v4
        with:
          name: lockfile
          path: .

      - name: Generate the world with the test lab (showroom and sample buildings)
        run: |
          pip install --quiet numpy
          ALOLA_LAB=1 python -m tools.worldgen.generate --save --out build/tourworld/Alola --preview build/tour-map.png

      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: downloads-${{ hashFiles('modpack.lock.json', 'modlist.toml') }}
          restore-keys: downloads-

      - name: Assemble client with the Alola world and the camera tour
        run: |
          python tools/modpack.py client --dir run --skip '^distanthorizons$'
          # the pack's own defaults (resource packs etc.), then the tour's overrides (later keys win)
          cp run/config/yosbr/options.txt run/options.txt
          printf 'renderDistance:10\nsimulationDistance:5\ngraphicsMode:1\nmaxFps:30\ntutorialStep:none\nonboardAccessibility:false\npauseOnLostFocus:false\nfov:0.25\nbiomeBlendRadius:2\nao:true\nentityShadows:true\n' >> run/options.txt
          mkdir -p run/saves run/config
          cp -r build/tourworld/Alola run/saves/Alola
          cp -r build/tourworld/tour/alola_tour run/saves/Alola/datapacks/alola_tour
          printf 'enableShaders=false\n' > run/config/iris.properties

      - name: Fly the camera through Alola and take screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xdotool imagemagick >/dev/null
          tools/tour.sh

      - name: Upload client log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-log
          path: |
            run/logs/latest.log
            run/launcher.log
            run/crash-reports/
          if-no-files-found: ignore

      - name: Publish the screenshots
        if: always()
        run: |
          cp run/logs/latest.log tour/client.log 2>/dev/null || true
          cd tour && zip -q -r ../tour-screenshots.zip . && cd ..
          ls -la tour-screenshots.zip

      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: tour
          name: Alola Region screenshots (CI)
          prerelease: true
          make_latest: false
          body: In-game screenshots of the Alola Region world from `${{ github.sha }}`, taken by the CI camera tour.
          files: tour-screenshots.zip

  publish:
    name: Publish tested pack to the "latest" release
    needs: [build, client]
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: modpack
          path: dist

      - name: Rename for download
        run: |
          mkdir -p out
          cp dist/*.mrpack out/Pokemon-Alola-Adventure.mrpack
          cp dist/build/alola-map.png out/alola-map.png 2>/dev/null || find dist -name alola-map.png -exec cp {} out/ \;

      - name: Update the rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pokémon Alola Adventure (latest tested build)
          prerelease: true
          make_latest: false
          body: |
            Automatically built from `${{ github.sha }}` after a real server and a real client both booted the pack.
            Import `Pokemon-Alola-Adventure.mrpack` in the Modrinth App or Prism Launcher; the Alola Region world is in your singleplayer list.
          files: |
            out/Pokemon-Alola-Adventure.mrpack
            out/alola-map.png
